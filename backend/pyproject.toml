[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency"
version = "0.1.0"
description = "AI-powered software agency converting client briefs into full-stack web applications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6.0",
    "docker>=7.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "langfuse>=2.0.0",
]

[project.scripts]
agency = "agency.interfaces.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0",
    "types-docker>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
markers = [
    "docker: marks tests as requiring a Docker daemon (deselect with '-m \"not docker\"')",
]
