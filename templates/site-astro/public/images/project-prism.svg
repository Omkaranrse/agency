  <rect x="80" y="80" width="180" height="80" rx="2" fill="#9C4126"/>
  <text x="170" y="125" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Primary Token</text>
