# ==============================================================================
# Agency Full-Stack Production & Local Development Compose
# ==============================================================================
# Services:
#   - backend: FastAPI REST API & LangGraph Execution Engine (Port 8000)
#   - dashboard: Next.js Web UI & Operator Dashboard (Port 3000)
#   - langfuse-server: Observability UI & Tracing API (Port 3001)
#   - langfuse-worker: Async telemetry background worker
#   - langfuse-db: PostgreSQL 16 persistence for Langfuse
#   - langfuse-redis: Redis 7 cache for Langfuse
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agency-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      AGENCY_ENVIRONMENT: "${AGENCY_ENVIRONMENT:-production}"
      AGENCY_API_KEY: "${AGENCY_API_KEY:-agency-secret-key-12345}"
      AGENCY_ALLOW_UNAUTHENTICATED: "${AGENCY_ALLOW_UNAUTHENTICATED:-false}"
      AGENCY_CHECKPOINT_DB_PATH: "/app/data/checkpoints.sqlite"
      AGENCY_ARTIFACTS_DIR: "/app/artifacts"
      DASHBOARD_ORIGINS: "${DASHBOARD_ORIGINS:-http://localhost:3000}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-pk-lf-local}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-sk-lf-local}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-http://langfuse-server:3000}"
    volumes:
      - backend_data:/app/data
      - backend_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agency-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
      NEXT_PUBLIC_API_KEY: "${AGENCY_API_KEY:-agency-secret-key-12345}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  langfuse-server:
    image: ghcr.io/langfuse/langfuse:2.100.0
    container_name: agency-langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-agency-dev-nextauth-secret-change-in-prod-min-32-chars}"
      SALT: "${LANGFUSE_SALT:-agency-dev-salt-change-in-prod-min-32-chars}"
      NEXTAUTH_URL: "${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}"
      REDIS_HOST: "langfuse-redis"
      REDIS_PORT: "6379"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      NODE_ENV: "production"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/api/public/health\", (r) => {if (r.statusCode !== 200) process.exit(1)})'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:2.100.0
    container_name: agency-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}"
      REDIS_HOST: "langfuse-redis"
      REDIS_PORT: "6379"
      SALT: "${LANGFUSE_SALT:-agency-dev-salt-change-in-prod-min-32-chars}"
      TELEMETRY_ENABLED: "false"
      NODE_ENV: "production"

  langfuse-db:
    image: postgres:16-alpine
    container_name: agency-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${LANGFUSE_DB_USER:-langfuse}"
      POSTGRES_PASSWORD: "${LANGFUSE_DB_PASSWORD:-langfuse}"
      POSTGRES_DB: "${LANGFUSE_DB_NAME:-langfuse}"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-redis:
    image: redis:7-alpine
    container_name: agency-langfuse-redis
    restart: unless-stopped
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
    name: agency_backend_data
  backend_artifacts:
    name: agency_backend_artifacts
  langfuse_postgres_data:
    name: agency_langfuse_postgres_data
  langfuse_redis_data:
    name: agency_langfuse_redis_data
