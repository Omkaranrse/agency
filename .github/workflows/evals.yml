name: Evaluations & Observability Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "Evaluation Execution Mode"
        required: true
        default: "fake"
        type: choice
        options:
          - "fake"
          - "real"
      target_brief:
        description: "Target specific brief ID (leave blank for all 12)"
        required: false
        default: ""
        type: string
      max_budget_usd:
        description: "Maximum budget limit in USD (real mode only)"
        required: false
        default: "3.00"
        type: string

permissions:
  contents: read

jobs:
  deterministic-evals:
    name: Deterministic Quality Gate (Fake Mode)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'fake')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry & Backend Dependencies
        run: |
          python -m pip install --upgrade pip poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install --no-interaction --all-extras

      - name: Validate Evaluation Dataset Briefs
        run: |
          PYTHONPATH=backend/src:backend python -c "
          from pathlib import Path
          from evals.runner import EvaluationRunner
          runner = EvaluationRunner(dataset_dir=Path('backend/evals/briefs'))
          briefs = runner.load_briefs()
          print(f'Successfully validated {len(briefs)}/12 briefs against domain Brief schema.')
          assert len(briefs) == 12, f'Expected 12 briefs, found {len(briefs)}'
          "

      - name: Execute Deterministic Evaluation Suite
        run: |
          PYTHONPATH=backend/src:backend python -m agency.interfaces.cli.main eval run --mode fake --output-dir runs/evals

      - name: Upload Evaluation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-eval-reports
          path: runs/evals/
          retention-days: 14

  real-llm-evals:
    name: Manual Real-LLM Quality Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'real'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip poetry
          cd backend
          poetry config virtualenvs.create false
          poetry install --no-interaction --all-extras

      - name: Execute Budget-Capped Real Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_EVAL_BUDGET_USD: ${{ inputs.max_budget_usd }}
        run: |
          BRIEF_FLAG=""
          if [ -n "${{ inputs.target_brief }}" ]; then
            BRIEF_FLAG="--brief ${{ inputs.target_brief }}"
          fi
          PYTHONPATH=backend/src:backend python -m agency.interfaces.cli.main eval run \
            --mode real \
            --max-budget "${{ inputs.max_budget_usd }}" \
            $BRIEF_FLAG \
            --output-dir runs/evals

      - name: Upload Real-LLM Evaluation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-llm-eval-reports
          path: runs/evals/
          retention-days: 30
